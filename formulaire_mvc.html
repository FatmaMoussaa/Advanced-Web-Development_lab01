
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MVC - Person Form</title>
</head>
<body>

<h2>Person Form</h2>

<form action="Controller" method="post">

    First Name:
    <input type="text" name="firstName" required>
    <br><br>

    Last Name:
    <input type="text" name="lastName" required>
    <br><br>

    Birth Year:
    <input type="number" name="birthDay" required>
    <br><br>

    Sex:
    <input type="text" name="sex" required>
    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
